services:
  - type: web
    name: supercube-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://michdo93.github.io
      - key: ADMIN_KEY
        generateValue: true
      - key: TOP_N
        value: "6"
