services:
  - type: web
    name: supercube-backend-service
    env: php
    plan: free
    numInstances: 1
    startCommand: apache2-foreground
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supercube-db
          property: connectionString

databases:
  - name: supercube-db
    plan: free
    postgresVersion: "15"
